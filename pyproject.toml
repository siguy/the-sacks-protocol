[project]
name = "the-sacks-protocol"
version = "0.1.0"
description = "Wisdom extraction pipeline delivering daily Sacksian insights via WhatsApp"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "httpx>=0.27.0",          # Async HTTP client for Sefaria API
    "pydantic>=2.0",          # Data validation and settings
    "pyyaml>=6.0",            # Config file parsing
    "python-dotenv>=1.0.0",   # Environment variable management
    "anthropic>=0.40.0",      # Claude API for relevance scoring
    "rich>=13.0",             # Beautiful terminal output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
