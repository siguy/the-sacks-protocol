# Commentary Rotation by Day of Week
#
# Each day features a different commentator tradition:
# - Pshat (plain meaning): Rashi, Rashbam, Ibn Ezra
# - Drash (interpretive): Ramban, Midrash
# - Chassidic (spiritual): Sefat Emet, Or HaChaim

rotation:
  # Sunday - Start with the foundation
  0:
    primary: "Rashi"
    fallback: ["Rashbam", "Ibn Ezra"]
    tradition: "pshat"

  # Monday - Philosophical depth
  1:
    primary: "Ramban"
    fallback: ["Sforno", "Rashi"]
    tradition: "philosophical"

  # Tuesday - Aggadic expansion
  2:
    primary: "Bereishit Rabbah"  # Adjusts by book: Shemot Rabbah, etc.
    fallback: ["Midrash Tanchuma", "Rashi"]
    tradition: "midrash"

  # Wednesday - Spiritual insight
  3:
    primary: "Sefat Emet"
    fallback: ["Kedushat Levi", "Or HaChaim", "Rashi"]
    tradition: "chassidic"

  # Thursday - Rationalist/ethical lens
  4:
    primary: "Ibn Ezra"
    fallback: ["Sforno", "Kli Yakar", "Rashi"]
    tradition: "rationalist"

  # Friday - Shabbat preparation, mystical
  5:
    primary: "Or HaChaim"
    fallback: ["Sefat Emet", "Ramban", "Rashi"]
    tradition: "mystical"

  # Saturday - (Not typically generated, Shabbat)
  6:
    primary: "Rashi"
    fallback: []
    tradition: "pshat"

# Midrash mapping by Torah book
midrash_by_book:
  Genesis: "Bereishit Rabbah"
  Exodus: "Shemot Rabbah"
  Leviticus: "Vayikra Rabbah"
  Numbers: "Bamidbar Rabbah"
  Deuteronomy: "Devarim Rabbah"

